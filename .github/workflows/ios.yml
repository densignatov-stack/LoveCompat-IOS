name: Сборка LoveCompat iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Подготовить проект
        run: |
          mkdir -p lib
          mkdir -p assets

          cp main.dart lib/main.dart
          cp lovecompat_icon.png assets/lovecompat_icon.png

          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/main.dart")
          s = p.read_text()

          s = s.replace(
              """'Есть и совпадения, и различия.
Результат находится примерно посередине.'""",
              "'Есть и совпадения, и различия.\\nРезультат находится примерно посередине.'"
          )

          s = s.replace(
              """'There are both similarities and differences.
The result is around the middle.'""",
              "'There are both similarities and differences.\\nThe result is around the middle.'"
          )

          p.write_text(s)
          PY

          flutter create . --platforms=ios

      - name: Установить зависимости
        run: flutter pub get

      - name: Проверить код
        run: flutter analyze

      - name: Собрать iOS
        run: flutter build ios --release --no-codesign

      - name: Сохранить приложение
        uses: actions/upload-artifact@v4
        with:
          name: LoveCompat-iOS
          path: build/ios/iphoneos/Runner.app
