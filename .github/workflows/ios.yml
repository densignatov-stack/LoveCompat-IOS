name: Сборка LoveCompat iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Проверить Flutter
        run: flutter --version

      - name: Подготовить Flutter проект
        run: |
          mkdir -p lib
          cp main.dart lib/main.dart
          flutter create . --platforms=ios

      - name: Установить зависимости
        run: flutter pub get

      - name: Проверить Dart код
        run: flutter analyze

      - name: Собрать iOS
        run: flutter build ios --release --no-codesign

      - name: Сохранить результат сборки
        uses: actions/upload-artifact@v4
        with:
          name: LoveCompat-iOS
          path: build/ios/iphoneos/Runner.app
